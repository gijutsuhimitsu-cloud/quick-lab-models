<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溶けるか・混ざるか（組み合わせ版）の例</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.7; }
  input, button { font: inherit; padding: 6px 10px; }
  input[type=text] { width: min(100%, 420px); }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td, th { border-bottom: 1px solid #ccc; padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<h1>溶けるか・混ざるか（組み合わせ版）</h1>
<p>SMILES を入れると、25 °C の 14 溶媒の溶解度の見込みと幅を出します。計算はこのブラウザの中だけで行います。</p>
<p><label>SMILES <input id="smiles" type="text" value="CC(=O)Oc1ccccc1C(=O)O"></label></p>
<p><label>目標の濃度 mg/mL <input id="target" type="number" value="10" min="0.001" step="any"></label> <button id="go" disabled>読み込み中</button></p>
<p id="msg"></p>
<table id="out"></table>
<script src="../js/features.js"></script>
<script src="../js/abraham.js"></script>
<script src="../js/solub.js"></script>
<script src="../js/solfeat.js"></script>
<script src="../js/knn.js"></script>
<script src="../js/orgmodel.js"></script>
<script src="../js/solgnn.js"></script>
<script src="../js/solubility_ensemble.js"></script>
<script src="../../../vendor/rdkit/RDKit_minimal.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var VERD = { yes: '溶ける見込み', edge: '境目', no: '溶けない見込み' }, SHORT = { yes: '溶ける', edge: '境目', no: '溶けない' };
  var fmt = function (v) { return v >= 100 ? v.toFixed(0) : v.toPrecision(3); };
  function row(tag, cells) { var tr = document.createElement('tr'); cells.forEach(function (c) { var td = document.createElement(tag); td.textContent = c; tr.appendChild(td); }); return tr; }
  Promise.all([SolubilityEnsemble.load('../weights/'), initRDKitModule({ locateFile: function () { return '../../../vendor/rdkit/RDKit_minimal.wasm'; } })]).then(function (v) {
    var S = v[0], R = v[1], b = $('go');
    b.disabled = false; b.textContent = '見込みを出す';
    b.addEventListener('click', function () {
      var t = $('out'); t.textContent = ''; $('msg').textContent = '';
      try {
        var c = S.prepare(R, $('smiles').value), target = parseFloat($('target').value);
        $('msg').textContent = (c.TmC === null ? '融点が分からないので、融点なしのモデルで出した。' : '融点 ' + c.TmC + ' °C を使った。') + (c.outOfScope ? '有機溶媒の対象外の分子である。' : '');
        t.appendChild(row('th', ['溶媒', '見込み mg/mL', '幅', '文献の実測', '判定']));
        S.estimateAll(c, { target: target }).forEach(function (e) {
          var s = S.solvent(e.solvent);
          t.appendChild(row('td', [s.name, e.mgPerML === null ? '—' : fmt(e.mgPerML), e.range ? fmt(e.range[0]) + '〜' + fmt(e.range[1]) : '—', e.measured ? fmt(e.measured.mgPerML) : '', e.verdict ? (e.basis === 'measured' ? SHORT[e.verdict] + '（実測）' : VERD[e.verdict]) : '対象外']));
        });
      } catch (err) { $('msg').textContent = err.message; }
    });
  }).catch(function (err) { $('msg').textContent = '読み込めなかった：' + err.message + '（README の手順でサーバーから開く）'; });
})();
</script>
</body>
</html>
